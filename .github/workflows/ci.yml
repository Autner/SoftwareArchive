name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check all scripts
        run: |
          bash -n Work/Scripts/SoftwareArchive.sh
          bash -n Work/Scripts/SoftwareArchiveCore.sh
          bash -n Work/Scripts/Init.sh
          bash -n Work/Tests/run-tests.sh
          bash -n 启动软件档案管理.command
          bash -n packaging/build-macos-app.sh

      - name: Unit tests
        run: bash Work/Tests/run-tests.sh

      - name: Package smoke test (build app + dmg)
        run: bash packaging/build-macos-app.sh

      - name: App entry smoke test (code-in-app, data-in-home)
        run: |
          ENTRY="packaging/output/stage/dmg/软件档案管理.app/Contents/MacOS/软件档案管理"
          RES="packaging/output/stage/dmg/软件档案管理.app/Contents/Resources/SoftwareArchive"
          rm -rf /tmp/sa-smoke-home && mkdir -p /tmp/sa-smoke-home
          # 1) 首次运行：数据目录建立在家目录
          HOME=/tmp/sa-smoke-home SA_SILENT=1 bash "$ENTRY"
          D=/tmp/sa-smoke-home/SoftwareArchive
          test -f "$D/Work/Config/config.yml"
          test -f "$D/Library/资源索引.xlsx"
          test -d "$D/Work/Repositories"
          # 2) 代码不进数据目录；数据缓存不进 App 包
          test ! -e "$D/Work/Scripts"
          test ! -d "$RES/Work/Repositories"
          test ! -d "$RES/Work/Downloads"
          # 3) 重复运行：数据与用户配置原样保留
          echo "marker" > "$D/Library/数据标记.txt"
          echo "custom_setting: keep" >> "$D/Work/Config/config.yml"
          HOME=/tmp/sa-smoke-home SA_SILENT=1 bash "$ENTRY"
          grep -q marker "$D/Library/数据标记.txt"
          grep -q "custom_setting: keep" "$D/Work/Config/config.yml"
          # 4) 分离模式下功能入口可用
          (cd "$RES" && SA_DATA_HOME="$D" bash Work/Scripts/SoftwareArchive.sh -Action Verify)
          rm -rf /tmp/sa-smoke-home
